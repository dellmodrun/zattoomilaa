name: Refresh market data

on:
  workflow_dispatch:
    inputs:
      mint:
        description: Solana token mint
        required: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-market-data.mjs
        env:
          TOKEN_MINT: ${{ inputs.mint }}
      - name: Commit refreshed data
        run: |
          git config user.name "zattoo market bot"
          git config user.email "actions@users.noreply.github.com"
          git add market-data.json
          git diff --cached --quiet || git commit -m "Refresh live market data"
          git push
